<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Cinema</title>

<style>
:root{
  --bg:#050505;
  --red:#ff204e;
  --text:#ffffff;
  --muted:#888;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial Black, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
  overflow:hidden;
}

/* Container */
.container{
  max-width:500px;
  padding:20px;
  animation:fadeIn 1s ease;
}

/* Logo */
.logo{
  width:180px;
  margin-bottom:25px;
  opacity:0.95;
}

/* Title */
.title{
  font-size:22px;
  letter-spacing:2px;
  margin-bottom:15px;
  color:var(--red);
}

/* Message */
.message{
  font-family:Arial, sans-serif;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

/* Subtle glow */
.glow{
  position:absolute;
  width:400px;
  height:400px;
  background:radial-gradient(circle, rgba(255,32,78,0.15), transparent 70%);
  filter:blur(40px);
  z-index:-1;
}

/* Animation */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
  <!-- 🔥 Replace with your logo file -->
  <img src="logo.gif" alt="AI Cinema Logo" class="logo">

  <div class="title">AI CINEMA IS DISCONTINUED</div>

  <div class="message">
    We are sorry to say this, but AI Cinema is now discontinued.<br><br>
    Something better is on its way soon.
  </div>
</div>

</body>
</html>
