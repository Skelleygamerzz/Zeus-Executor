<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI CINEMA 🍿</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --zeus-red: #ff204e;
            --bg-black: #050505;
            --drawer-width: 80%; /* Wider on mobile for better reach */
        }

        /* Prevent overscroll bounce and accidental refresh */
        html, body {
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: fixed;
            background-color: var(--bg-black);
        }

        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
            scrollbar-width: none; 
        }
        *::-webkit-scrollbar { display: none; }

        body {
            color: white;
            font-family: 'Arial Black', sans-serif;
            margin: 0;
            /* Use svh (Small Viewport Height) to prevent mobile browser glitches */
            height: 100svh; 
        }

        .brand-logo { height: 38px; width: auto; pointer-events: none; }
        
        /* --- MAIN APP WRAPPER --- */
        #main-app { 
            display: none; 
            height: 100svh; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* Smooth inertia scroll for iOS */
        }

        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: env(safe-area-inset-top) 5% 15px; 
            background: rgba(0,0,0,0.95); 
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }

        /* --- CAROUSEL FIXES --- */
        .section-title { padding: 0 5%; margin-top: 25px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .section-title span { color: var(--zeus-red); font-size: 10px; letter-spacing: 2px; }

        .carousel { 
            display: flex; overflow-x: auto; padding: 15px 5%; gap: 12px; 
            scroll-snap-type: x proximity;
        }

        .show-card { min-width: 140px; width: 140px; scroll-snap-align: start; }
        .show-card video, .show-card img { 
            width: 100%; aspect-ratio: 9/16; object-fit: cover; 
            border-radius: 10px; border: 1px solid #1a1a1a; 
        }

        /* --- TIKTOK FEED (THE BIG FIX) --- */
        #video-feed {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100svh;
            background: black;
            z-index: 2000;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            touch-action: pan-y; /* Fixes "sticky" scroll glitch */
        }

        .feed-item {
            width: 100%; height: 100svh;
            scroll-snap-align: start;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .feed-item video { width: 100%; height: 100%; object-fit: contain; }

        .feed-sidebar {
            position: absolute; right: 12px; bottom: 100px;
            display: flex; flex-direction: column; gap: 18px; z-index: 2100;
        }

        .action-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .action-btn i { font-size: 26px; }
        .action-btn span { font-size: 10px; margin-top: 4px; font-family: Arial; }

        .video-controls { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 5%; width: 90%; z-index: 2100; }
        .seeker { width: 100%; accent-color: var(--zeus-red); height: 3px; }

        .close-feed { 
            position: fixed; top: calc(15px + env(safe-area-inset-top)); right: 15px; 
            z-index: 2200; font-size: 22px; color: white; background: rgba(0,0,0,0.4); 
            width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        /* --- LOGIN FIX --- */
        #login-screen {
            height: 100svh; display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        .login-card {
            background: rgba(15, 15, 15, 0.98); padding: 40px 25px; border-radius: 20px;
            text-align: center; width: 85%; max-width: 340px; border: 1px solid #222;
        }
        
        .circle-btn { width: 65px; height: 65px; background: white; border-radius: 50%; margin: 25px auto; display: flex; align-items: center; justify-content: center; border: none; }
        .circle-btn img { width: 30px; }

        /* --- DRAWER --- */
        .drawer { 
            position: fixed; top: 0; right: -100%; width: var(--drawer-width); 
            height: 100svh; background: #080808; z-index: 1000; transition: 0.3s ease-out; 
            padding: calc(60px + env(safe-area-inset-top)) 20px; border-left: 1px solid #1a1a1a; 
        }
        .drawer.active { right: 0; }
        .drawer-item { padding: 20px; border-bottom: 1px solid #111; color: #777; font-size: 14px; }
        #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="sideDrawer">
        <div class="drawer-item" id="drawer-name">MEMBER</div>
        <div class="drawer-item" onclick="signOut()">LOG OUT</div>
        <div class="drawer-item" style="color:#421; margin-top: 40px;" onclick="deleteAccount()">DELETE ACCOUNT</div>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <img src="logo.gif" class="brand-logo" style="margin: 0 auto;">
            <p style="color: #555; font-size: 10px; margin-top: 30px; letter-spacing: 2px;">SECURE ACCESS</p>
            <button class="circle-btn" onclick="signIn('google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg">
            </button>
            <p onclick="signIn('guest')" style="color:#222; font-size:10px; cursor:pointer;">CONTINUE AS GUEST</p>
        </div>
    </div>

    <div id="main-app">
        <nav>
            <img src="logo.gif" class="brand-logo">
            <div onclick="toggleDrawer()" style="cursor:pointer; padding: 5px;">
                <div style="width:20px; height:2px; background:white; margin:4px;"></div>
                <div style="width:20px; height:2px; background:white; margin:4px;"></div>
            </div>
        </nav>

        <div class="section-title">FRUIT LOVE ISLAND <span>SEASON 1</span></div>
        <div class="carousel">
            <div class="show-card" onclick="openFeed(0)">
                <video muted loop autoplay playsinline><source src="episode1.mp4" type="video/mp4"></video>
                <div class="show-info">E1: THE FIRST SQUEEZE</div>
            </div>
            </div>

        <div class="section-title">PRETTY QUEENS <span>COMING SOON</span></div>
        <div class="carousel">
            <div class="show-card" style="opacity: 0.3;">
                <div style="background:#111; aspect-ratio:9/16; border-radius:10px; border:1px solid #222;"></div>
                <div class="show-info">LOCKED</div>
            </div>
        </div>
    </div>

    <div id="video-feed">
        <div class="close-feed" onclick="closeFeed()">✕</div>
        
        <div class="feed-item">
            <video class="feed-video" loop playsinline onclick="toggleVideo(this)">
                <source src="episode1.mp4" type="video/mp4">
            </video>
            
            <div class="feed-sidebar">
                <button class="action-btn" onclick="this.style.color='var(--zeus-red)'">❤️<span>1.2k</span></button>
                <button class="action-btn">💬<span>452</span></button>
                <button class="action-btn" onclick="toggleMute(this)">🔊</button>
            </div>

            <div class="video-controls">
                <input type="range" class="seeker" value="0" min="0" max="100" oninput="seekVideo(this)">
            </div>
        </div>
        </div>

    <script>
        // --- FIREBASE SETUP ---
        const firebaseConfig = {
    apiKey: "AIzaSyA11ejzUSS4Vxuxq2BolT-1zYbbTC6lS58",
    authDomain: "ai-cinema-7589b.firebaseapp.com",
    projectId: "ai-cinema-7589b",
    storageBucket: "ai-cinema-7589b.firebasestorage.app",
    messagingSenderId: "644187979775",
    appId: "1:644187979775:web:93384ffa68a9b1815c31ca",
    measurementId: "G-VJXN2W3ETD"
  };

        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('drawer-name').innerText = user.displayName ? user.displayName.toUpperCase() : "MEMBER";
            }
        });

        function signIn(type) {
            if (type === 'guest') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                return;
            }
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider);
        }

        // --- MOBILE SMOOTH FEED ---
        function openFeed(index) {
            const feed = document.getElementById('video-feed');
            feed.style.display = 'block';
            const v = document.querySelectorAll('.feed-video')[index];
            v.play();
        }

        function closeFeed() {
            document.getElementById('video-feed').style.display = 'none';
            document.querySelectorAll('.feed-video').forEach(v => v.pause());
        }

        function toggleVideo(v) { v.paused ? v.play() : v.pause(); }
        
        function toggleMute(btn) {
            const v = btn.closest('.feed-item').querySelector('video');
            v.muted = !v.muted;
            btn.innerText = v.muted ? '🔇' : '🔊';
        }

        function seekVideo(range) {
            const v = range.closest('.feed-item').querySelector('video');
            v.currentTime = (range.value / 100) * v.duration;
        }

        document.querySelectorAll('.feed-video').forEach(v => {
            v.ontimeupdate = () => {
                const range = v.parentElement.querySelector('.seeker');
                if(range) range.value = (v.currentTime / v.duration) * 100;
            };
        });

        function toggleDrawer() {
            const d = document.getElementById('sideDrawer');
            d.classList.toggle('active');
            document.getElementById('overlay').style.display = d.classList.contains('active') ? 'block' : 'none';
        }

        function signOut() { firebase.auth().signOut().then(() => location.reload()); }
    </script>
</body>
</html>
