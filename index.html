<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #030304;
      color: #d4cfc9;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* grain */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px;
      opacity: 0.028;
      pointer-events: none;
      z-index: 99;
    }

    /* ambient glow */
    .glow {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 100, 0, 0.07) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    .content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      letter-spacing: 8px;
      color: #fff;
      margin-bottom: 56px;
      animation: fadeUp 0.8s ease both;
    }
    .logo em {
      color: #f5a623;
      font-style: normal;
      text-shadow: 0 0 24px rgba(245,166,35,0.45);
    }

    .divider-top {
      width: 1px; height: 48px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15));
      margin-bottom: 48px;
      animation: fadeUp 0.8s 0.1s ease both;
    }

    .headline {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 7.5rem);
      line-height: 0.92;
      letter-spacing: 2px;
      color: #fff;
      animation: fadeUp 0.8s 0.15s ease both;
    }
    .headline em {
      display: block;
      color: #f5a623;
      font-style: normal;
      text-shadow: 0 0 60px rgba(245,166,35,0.3);
    }

    .tagline {
      margin-top: 28px;
      font-size: clamp(0.8rem, 2vw, 1rem);
      font-weight: 300;
      color: #5a5860;
      letter-spacing: 1px;
      line-height: 1.8;
      max-width: 400px;
      animation: fadeUp 0.8s 0.22s ease both;
    }
    .tagline strong {
      color: #888;
      font-weight: 400;
    }

    .divider-bottom {
      width: 40px; height: 1px;
      background: rgba(245,166,35,0.3);
      margin-top: 44px;
      animation: fadeUp 0.8s 0.28s ease both;
    }

    .sig {
      margin-top: 22px;
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #3a3840;
      animation: fadeUp 0.8s 0.32s ease both;
    }
    .sig em { color: #f5a623; font-style: normal; opacity: 0.6; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <div class="content">
    <div class="logo">SOMETHING <em>GAMES</em></div>

    <div class="divider-top"></div>

    <h1 class="headline">
      We'll be
      <em>Back Soon.</em>
    </h1>

    <p class="tagline">
      Something better is coming.<br />
      <strong>Stay tuned.</strong>
    </p>

    <div class="divider-bottom"></div>
    <p class="sig">— <em>Something Games</em></p>
  </div>
</body>
</html>
