<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konbu — Coming Soon</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --white: #FFFFFF;
            --charcoal: #0A0A0A;
            --gray: #888888;
            --accent: #FFFFFF;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--charcoal);
            color: var(--white);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('backround.png');
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.4);
            z-index: -1;
            transform: scale(1.1);
        }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 100;
            mix-blend-mode: overlay;
        }

        .container {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 1;
        }

        .logo {
            max-width: clamp(300px, 60vw, 600px);
            height: auto;
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeSlideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        .tagline {
            font-size: clamp(0.875rem, 2vw, 1.125rem);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 4rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
        }

        .status-container {
            text-align: center;
            max-width: 600px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .status-badge:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .status-text {
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 400;
        }

        .description {
            font-size: clamp(1.125rem, 3vw, 1.375rem);
            line-height: 1.6;
            font-weight: 400;
            margin-bottom: 3rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .cta-button {
            display: inline-block;
            padding: 1rem 3rem;
            background: var(--white);
            color: var(--charcoal);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            border-radius: 4px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: var(--accent);
            transform: translate(-50%, -50%);
            transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1), height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .cta-button:hover::before {
            width: 300%;
            height: 300%;
        }

        .countdown-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin: 2rem 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeSlideUp 1.2s ease 0.9s forwards;
        }

        .countdown-item {
            text-align: center;
            padding: 1rem;
            background: rgba(250, 247, 240, 0.05);
            border: 1px solid rgba(250, 247, 240, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        .countdown-number {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: rgba(250, 247, 240, 0.95);
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .countdown-label {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(250, 247, 240, 0.6);
            font-weight: 500;
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            animation: fadeIn 1.2s ease 1.2s forwards;
        }

        .decorative-line {
            position: absolute;
            width: 1px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, var(--accent), transparent);
            top: 50%;
            opacity: 0.3;
        }

        .line-left {
            left: 15%;
            animation: lineSlide 2s ease-in-out infinite;
        }

        .line-right {
            right: 15%;
            animation: lineSlide 2s ease-in-out infinite 1s;
        }

        @keyframes lineSlide {
            0%, 100% { transform: translateY(-20px); }
            50% { transform: translateY(20px); }
        }

        @keyframes fadeSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .decorative-line {
                display: none;
            }

            .logo {
                margin-bottom: 1rem;
            }

            .tagline {
                margin-bottom: 3rem;
            }

            .countdown-container {
                gap: 0.5rem;
            }

            .countdown-item {
                padding: 0.75rem 0.5rem;
            }

            .countdown-number {
                font-size: clamp(1.5rem, 8vw, 2rem);
            }

            .countdown-label {
                font-size: 0.625rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    <div class="grain-overlay"></div>
    <div class="decorative-line line-left"></div>
    <div class="decorative-line line-right"></div>
    
    <div class="container">
        <img src="KonbuLogo.png" alt="Konbu" class="logo">
        <p class="tagline">Modern Cafe Experience</p>
        
        <div class="status-container">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span class="status-text">Releasing February 5th</span>
            </div>
            
            <p class="description">
                A new kind of cafe is brewing. Immerse yourself in contemporary design, 
                refined atmosphere, and a community-driven experience. Opening soon.
            </p>

            <!-- Countdown Timer -->
            <div class="countdown-container">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">00</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">00</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">00</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">00</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>
            
            <a href="#" class="cta-button">Join Communications Server</a>
        </div>
        
        <div class="footer">Konbu © 2026</div>
    </div>

    <script>
        // Countdown Timer
        const countdownDate = new Date("February 5, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = countdownDate - now;

            // Calculate time units
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the result
            document.getElementById("days").textContent = String(days).padStart(2, '0');
            document.getElementById("hours").textContent = String(hours).padStart(2, '0');
            document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
            document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');

            // If countdown is over
            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("days").textContent = "00";
                document.getElementById("hours").textContent = "00";
                document.getElementById("minutes").textContent = "00";
                document.getElementById("seconds").textContent = "00";
                document.querySelector(".status-text").textContent = "Now Open!";
            }
        }

        // Update countdown every second
        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
