<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cookie Consent Example</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    .cookie-box {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #1c1c1c;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .cookie-buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .accept {
      background: #5865F2;
      color: white;
    }

    .decline {
      background: #333;
      color: white;
    }
  </style>
</head>
<body>

  <h1 style="padding:20px;">My Streaming Website</h1>

  <div class="cookie-box" id="cookieBox">
    <h3>Privacy & Cookies</h3>

    <p>
      We respect your privacy. If you accept, we may collect
      general non-personal information such as your city,
      region, browser type, and device information for analytics
      and security purposes.
    </p>

    <div class="cookie-buttons">
      <button class="accept" onclick="acceptCookies()">
        Accept
      </button>

      <button class="decline" onclick="declineCookies()">
        Decline
      </button>
    </div>
  </div>

  <script>
    // YOUR DISCORD WEBHOOK
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1504925874116628643/Emz-0cjWg3xGrXjJwuc9jijhsxSA2msREN9hAWZfbGdH432hLiqxQEJo2uIFGqiNvIum";

    async function acceptCookies() {

      // Save consent
      localStorage.setItem("cookieConsent", "accepted");

      try {

        // Gets NON-PERSONAL location data only
        const response = await fetch("https://ipapi.co/json/");
        const data = await response.json();

        // Only sending safe/general info
        const payload = {
          content:
`📊 New Website Visitor Accepted Cookies

🌎 City: ${data.city}
🗺 Region: ${data.region}
🏳 Country: ${data.country_name}

💻 Browser: ${navigator.userAgent}
📱 Platform: ${navigator.platform}
🕒 Time: ${new Date().toLocaleString()}`
        };

        // Send to Discord webhook
        await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

      } catch (err) {
        console.error("Failed to send webhook:", err);
      }

      document.getElementById("cookieBox").style.display = "none";
    }

    function declineCookies() {
      localStorage.setItem("cookieConsent", "declined");
      document.getElementById("cookieBox").style.display = "none";
    }

    // Hide popup if already answered
    window.onload = () => {
      const consent = localStorage.getItem("cookieConsent");

      if (consent) {
        document.getElementById("cookieBox").style.display = "none";
      }
    };
  </script>

</body>
</html>
