<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI CINEMA</title>
    
    <link rel="icon" type="image/gif" href="favicon.gif">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --zeus-red: #ff204e;
            --bg-black: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        /* --- CORE RESET --- */
        html, body {
            overflow: hidden;
            height: 100%; width: 100%;
            position: fixed;
            background-color: var(--bg-black);
            margin: 0;
            color: white;
            font-family: 'Arial Black', sans-serif;
        }

        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        /* --- SCROLLING WRAPPER --- */
        #main-app { 
            display: none; 
            height: 100svh; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            padding-bottom: 50px;
        }

        /* --- NAV BAR --- */
        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: env(safe-area-inset-top) 5% 15px; 
            background: rgba(0,0,0,0.8); 
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .brand-logo { height: 35px; width: auto; }

        /* --- HOME UI --- */
        .section-header { 
            padding: 30px 5% 10px; 
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .section-header h2 { margin: 0; font-size: 18px; letter-spacing: -0.5px; }
        .section-header span { color: var(--zeus-red); font-size: 10px; letter-spacing: 2px; }

        .carousel { 
            display: flex; overflow-x: auto; padding: 10px 5% 20px; gap: 15px; 
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .show-card { 
            min-width: 160px; width: 160px; 
            scroll-snap-align: start; 
            cursor: pointer; 
            transition: transform 0.3s ease;
        }
        .show-card:active { transform: scale(0.96); }
        
        .thumb-wrap {
            position: relative;
            width: 100%; aspect-ratio: 9/16;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            background: #111;
        }
        .show-card video, .show-card img { width: 100%; height: 100%; object-fit: cover; }

        .show-info { 
            padding: 10px 2px; 
            font-size: 11px; 
            font-family: 'Arial', sans-serif; 
            color: #888; 
            font-weight: bold;
        }

        /* --- TIKTOK FEED --- */
        #video-feed {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100svh;
            background: black;
            z-index: 2000;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .feed-item {
            width: 100%; height: 100svh;
            scroll-snap-align: start;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .feed-item video { width: 100%; height: 100%; object-fit: contain; }

        .feed-sidebar {
            position: absolute; right: 15px; bottom: 120px;
            display: flex; flex-direction: column; gap: 25px; z-index: 2100;
        }
        .action-btn { 
            background: none; border: none; color: white; 
            display: flex; flex-direction: column; align-items: center; 
            font-size: 22px; cursor: pointer; 
        }
        .action-btn span { font-size: 10px; margin-top: 5px; font-family: Arial; }

        .feed-ui { position: absolute; bottom: 80px; left: 20px; pointer-events: none; }
        .feed-ui h2 { color: var(--zeus-red); font-size: 22px; margin: 0; }
        .feed-ui p { font-family: Arial; font-size: 14px; margin: 5px 0; opacity: 0.8; }

        .video-controls { position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); left: 5%; width: 90%; z-index: 2100; }
        .seeker { width: 100%; accent-color: var(--zeus-red); height: 4px; }

        .close-feed { 
            position: fixed; top: calc(20px + env(safe-area-inset-top)); right: 20px; 
            z-index: 2200; width: 40px; height: 40px; background: rgba(0,0,0,0.5); 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); cursor: pointer;
        }

        /* --- LOGIN & DRAWER --- */
        #login-screen {
            height: 100svh; display: flex; align-items: center; justify-content: center;
            background: #000;
        }
        .login-card {
            background: var(--glass); padding: 50px 30px; border-radius: 30px;
            text-align: center; width: 85%; max-width: 360px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }
        .circle-btn { 
            width: 75px; height: 75px; background: white; border-radius: 50%; 
            margin: 35px auto; display: flex; align-items: center; justify-content: center; 
            border: none; cursor: pointer;
        }

        .drawer { 
            position: fixed; top: 0; right: -100%; width: 300px; max-width: 85%;
            height: 100svh; background: #0a0a0a; z-index: 3000; 
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            padding: calc(70px + env(safe-area-inset-top)) 20px; 
            border-left: 1px solid #1a1a1a; 
        }
        .drawer.active { right: 0; }
        .drawer-item { padding: 20px; border-bottom: 1px solid #151515; color: #555; font-size: 13px; }
        #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2999; }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="sideDrawer">
        <div class="drawer-item" id="drawer-name" style="color: white; font-size: 16px;">MEMBER</div>
        <div class="drawer-item" onclick="signOut()" style="cursor:pointer">LOG OUT</div>
        <div class="drawer-item" style="color:#411; margin-top: 100px; cursor:pointer" onclick="deleteAccount()">DELETE ACCOUNT</div>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <img src="logo.gif" class="brand-logo">
            <p id="auth-title" style="color: #666; font-size: 10px; margin-top: 40px; letter-spacing: 2px;">SECURE SIGN IN</p>
            <button class="circle-btn" onclick="signIn('google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="35">
            </button>
            <p id="auth-toggle" onclick="toggleAuthMode()" style="color:var(--zeus-red); font-size:11px; cursor:pointer;">NEW? CREATE ACCOUNT</p>
            <p onclick="signIn('guest')" style="color:#222; font-size:10px; margin-top:25px; cursor:pointer;">GUEST ACCESS</p>
        </div>
    </div>

    <div id="main-app">
        <nav>
            <img src="logo.gif" class="brand-logo">
            <div onclick="toggleDrawer()" style="cursor:pointer">
                <div style="width:20px; height:2px; background:white; margin:5px;"></div>
                <div style="width:20px; height:2px; background:white; margin:5px;"></div>
            </div>
        </nav>

        <div class="section-header">
            <h2>FRUIT LOVE ISLAND</h2>
            <span>SEASON 1</span>
        </div>
        
        <div class="carousel">
            <div class="show-card" onclick="openFeed(0)">
                <div class="thumb-wrap">
                    <video muted loop autoplay playsinline><source src="episode1.mp4" type="video/mp4"></video>
                </div>
                <div class="show-info">E01: THE FIRST SQUEEZE</div>
            </div>
            </div>

        <div style="padding: 60px 0; text-align: center; font-size: 10px; color: #1a1a1a; letter-spacing: 3px;">
            AI CINEMA NETWORK V2.4
        </div>
    </div>

    <div id="video-feed">
        <div class="close-feed" onclick="closeFeed()">✕</div>
        
        <div class="feed-item">
            <video class="feed-video" loop playsinline onclick="toggleVideo(this)">
                <source src="episode1.mp4" type="video/mp4">
            </video>
            
            <div class="feed-sidebar">
                <button class="action-btn" onclick="this.style.color='var(--zeus-red)'">❤️<span>1.2k</span></button>
                <button class="action-btn">💬<span>452</span></button>
                <button class="action-btn" onclick="toggleMute(this)">🔊</button>
            </div>

            <div class="feed-ui">
                <h2>FRUIT LOVE ISLAND</h2>
                <p>E1: The First Squeeze 🍎</p>
            </div>

            <div class="video-controls">
                <input type="range" class="seeker" value="0" min="0" max="100" oninput="seekVideo(this)">
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA11ejzUSS4Vxuxq2BolT-1zYbbTC6lS58",
            authDomain: "ai-cinema-7589b.firebaseapp.com",
            projectId: "ai-cinema-7589b",
            storageBucket: "ai-cinema-7589b.firebasestorage.app",
            messagingSenderId: "644187979775",
            appId: "1:644187979775:web:93384ffa68a9b1815c31ca",
            measurementId: "G-VJXN2W3ETD"
        };
        firebase.initializeApp(firebaseConfig);

        let isSignUp = false;
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "CREATE ACCOUNT" : "SECURE SIGN IN";
            document.getElementById('auth-toggle').innerText = isSignUp ? "ALREADY A MEMBER? LOGIN" : "NEW? CREATE ACCOUNT";
        }

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('drawer-name').innerText = user.displayName ? user.displayName.toUpperCase() : "MEMBER";
            }
        });

        function signIn(type) {
            if (type === 'guest') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                return;
            }
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).catch(e => alert(e.message));
        }

        function openFeed(index) {
            document.getElementById('video-feed').style.display = 'block';
            const v = document.querySelectorAll('.feed-video')[index];
            if(v) v.play();
        }

        function closeFeed() {
            document.getElementById('video-feed').style.display = 'none';
            document.querySelectorAll('.feed-video').forEach(v => v.pause());
        }

        function toggleVideo(v) { v.paused ? v.play() : v.pause(); }
        
        function toggleMute(btn) {
            const v = btn.closest('.feed-item').querySelector('video');
            v.muted = !v.muted;
            btn.innerText = v.muted ? '🔇' : '🔊';
        }

        function seekVideo(range) {
            const v = range.closest('.feed-item').querySelector('video');
            v.currentTime = (range.value / 100) * v.duration;
        }

        document.querySelectorAll('.feed-video').forEach(v => {
            v.ontimeupdate = () => {
                const range = v.parentElement.querySelector('.seeker');
                if(range) range.value = (v.currentTime / v.duration) * 100;
            };
        });

        function toggleDrawer() {
            const d = document.getElementById('sideDrawer');
            d.classList.toggle('active');
            document.getElementById('overlay').style.display = d.classList.contains('active') ? 'block' : 'none';
        }

        function signOut() { firebase.auth().signOut().then(() => location.reload()); }
        function deleteAccount() { if(confirm("Permanently delete account?")) firebase.auth().currentUser.delete().then(()=>location.reload()); }
    </script>
</body>
</html>
