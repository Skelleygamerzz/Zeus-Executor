<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Cinema v2</title>

<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#050505;
  --red:#ff204e;
  --surface:#121212;
  --text:#fff;
  --muted:#888;
  --radius:14px;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.hidden{display:none}

/* LOGIN */
#login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  background:var(--surface);
  padding:40px;
  border-radius:var(--radius);
  width:320px;
  text-align:center;
  border:1px solid #222;
}
button{
  cursor:pointer;
}

/* MAIN */
nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #222;
}
.logo{color:var(--red); font-weight:900}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;
  padding:20px;
}

.card-show{
  background:#111;
  border-radius:12px;
  overflow:hidden;
  transition:0.2s;
}
.card-show:hover{transform:scale(1.03)}
.card-show img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-body{padding:10px}

/* ADMIN */
#adminPanel{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#111;
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
  width:260px;
}

input{
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#000;
  border:1px solid #333;
  color:#fff;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h2 style="color:var(--red)">AI CINEMA</h2>
    <button onclick="login()">Sign in with Google</button>
    <p id="err"></p>
  </div>
</div>

<!-- MAIN -->
<div id="app" class="hidden">

<nav>
  <div class="logo">AI CINEMA 🍿</div>
  <button onclick="logout()">Logout</button>
</nav>

<div id="episodes" class="grid"></div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">
  <h3>Admin Panel</h3>
  <input id="title" placeholder="Episode title">
  <input id="desc" placeholder="Description">
  <input id="img" placeholder="Thumbnail URL">
  <input id="video" placeholder="Video URL">
  <button onclick="addEpisode()">Add Episode</button>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA11ejzUSS4Vxuxq2BolT-1zYbbTC6lS58",
  authDomain: "ai-cinema-7589b.firebaseapp.com",
  projectId: "ai-cinema-7589b",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

/* CHANGE THIS TO YOUR UID */
const ADMIN_UIDS = ["YOUR_UID_HERE"];

let currentUser = null;

/* AUTH */
auth.onAuthStateChanged(async user=>{
  if(!user){
    document.getElementById("login").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");
    return;
  }

  currentUser = user;

  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  loadEpisodes();

  if(ADMIN_UIDS.includes(user.uid)){
    document.getElementById("adminPanel").classList.remove("hidden");
  }
});

function login(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>{
    document.getElementById("err").innerText = e.message;
  });
}

function logout(){
  auth.signOut();
}

/* FIRESTORE EPISODES */
async function loadEpisodes(){
  const snap = await db.collection("episodes").orderBy("created","desc").get();

  const container = document.getElementById("episodes");
  container.innerHTML = "";

  snap.forEach(doc=>{
    const d = doc.data();

    container.innerHTML += `
      <div class="card-show" onclick="play('${d.video}')">
        <img src="${d.img}">
        <div class="card-body">
          <b>${d.title}</b>
          <p style="color:#888;font-size:12px">${d.desc}</p>
        </div>
      </div>
    `;
  });
}

/* ADD EPISODE (ADMIN) */
async function addEpisode(){
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;
  const img = document.getElementById("img").value;
  const video = document.getElementById("video").value;

  await db.collection("episodes").add({
    title, desc, img, video,
    created: Date.now()
  });

  loadEpisodes();
}

/* PLAY */
function play(url){
  const w = window.open();
  w.document.write(`
    <video autoplay controls style="width:100%;height:100vh;background:black">
      <source src="${url}">
    </video>
  `);
}
</script>

</body>
</html>
