<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI CINEMA 🍿 | V2.3 Official</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        :root {
            --zeus-red: #ff204e;
            --bg-black: #050505;
        }

        /* --- GLOBAL FIXES --- */
        html, body {
            overflow: hidden;
            height: 100%;
            width: 100%;
            position: fixed;
            background-color: var(--bg-black);
            margin: 0;
        }

        * { 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            outline: none;
        }

        body {
            color: white;
            font-family: 'Arial Black', sans-serif;
            height: 100svh; /* Dynamic viewport height for mobile */
        }

        .brand-logo { height: 38px; width: auto; pointer-events: none; }
        
        /* --- MAIN APP WRAPPER --- */
        #main-app { 
            display: none; 
            height: 100svh; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: env(safe-area-inset-top) 5% 15px; 
            background: rgba(0,0,0,0.95); 
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px);
        }

        /* --- HOME SCREEN LAYOUT --- */
        .section-title { padding: 0 5%; margin-top: 25px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .section-title span { color: var(--zeus-red); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }

        .carousel { 
            display: flex; overflow-x: auto; padding: 15px 5%; gap: 12px; 
            scroll-snap-type: x proximity;
            scrollbar-width: none;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .show-card { min-width: 145px; width: 145px; scroll-snap-align: start; cursor: pointer; transition: 0.2s; }
        .show-card:active { transform: scale(0.95); }
        .show-card video, .show-card img { 
            width: 100%; aspect-ratio: 9/16; object-fit: cover; 
            border-radius: 12px; border: 1px solid #1a1a1a; 
        }
        .show-info { padding: 8px 0; font-size: 10px; font-family: 'Arial'; color: #666; text-transform: uppercase; }

        /* --- TIKTOK FEED OVERLAY --- */
        #video-feed {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100svh;
            background: black;
            z-index: 2000;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            touch-action: pan-y;
        }

        .feed-item {
            width: 100%; height: 100svh;
            scroll-snap-align: start;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .feed-item video { width: 100%; height: 100%; object-fit: contain; }

        .feed-sidebar {
            position: absolute; right: 15px; bottom: 120px;
            display: flex; flex-direction: column; gap: 22px; z-index: 2100;
        }

        .action-btn { background: none; border: none; color: white; display: flex; flex-direction: column; align-items: center; cursor: pointer; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .action-btn span { font-size: 10px; margin-top: 5px; font-family: Arial; font-weight: bold; }

        .video-controls { position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); left: 5%; width: 90%; z-index: 2100; }
        .seeker { width: 100%; accent-color: var(--zeus-red); height: 4px; cursor: pointer; }

        .feed-ui { position: absolute; bottom: 80px; left: 20px; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,1); }

        .close-feed { 
            position: fixed; top: calc(20px + env(safe-area-inset-top)); right: 20px; 
            z-index: 2200; font-size: 20px; color: white; background: rgba(0,0,0,0.5); 
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            height: 100svh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)), url('https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=2059');
            background-size: cover; background-position: center;
        }
        .login-card {
            background: rgba(10, 10, 10, 0.98); padding: 50px 30px; border-radius: 25px;
            text-align: center; width: 85%; max-width: 350px; border-top: 3px solid var(--zeus-red);
        }
        
        .circle-btn { 
            width: 70px; height: 70px; background: white; border-radius: 50%; margin: 30px auto; 
            display: flex; align-items: center; justify-content: center; border: none; 
            box-shadow: 0 10px 20px rgba(255, 32, 78, 0.2); transition: 0.2s;
        }
        .circle-btn:active { transform: scale(0.9); }
        .circle-btn img { width: 35px; }

        /* --- SLIM SIDE DRAWER --- */
        .drawer { 
            position: fixed; top: 0; right: -100%; 
            width: 300px; max-width: 80%;
            height: 100svh; background: #080808; z-index: 3000; 
            transition: 0.3s cubic-bezier(0.25, 1, 0.5, 1); 
            padding: calc(70px + env(safe-area-inset-top)) 20px; 
            border-left: 1px solid #1a1a1a; 
        }
        .drawer.active { right: 0; }
        .drawer-item { padding: 18px; border-bottom: 1px solid #111; color: #666; font-size: 13px; cursor: pointer; }
        .drawer-item.admin-link { color: #00d4ff; font-weight: bold; }
        
        #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2999; }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleDrawer()"></div>
    
    <div class="drawer" id="sideDrawer">
        <div class="drawer-item" id="drawer-name">MEMBER ACCESS</div>
        <a id="admin-link" class="drawer-item admin-link" href="https://console.firebase.google.com/" target="_blank" style="display:none; text-decoration: none;">🛡️ ADMIN PANEL</a>
        <div class="drawer-item" onclick="signOut()">LOG OUT</div>
        <div class="drawer-item" style="color:#311; margin-top: 50px;" onclick="deleteAccount()">DELETE ACCOUNT</div>
    </div>

    <div id="login-screen">
        <div class="login-card">
            <img src="logo.gif" class="brand-logo" style="margin: 0 auto;">
            <p id="auth-title" style="color: #444; font-size: 10px; margin-top: 35px; letter-spacing: 2px; font-weight: bold;">SIGN IN WITH</p>
            
            <button class="circle-btn" onclick="signIn('google')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg">
            </button>

            <p id="auth-toggle" onclick="toggleAuthMode()" style="color:var(--zeus-red); font-size:11px; cursor:pointer; font-family: Arial;">NEW TO THE NETWORK? SIGN UP</p>
            <p onclick="signIn('guest')" style="color:#222; font-size:10px; margin-top:20px; cursor:pointer;">CONTINUE AS GUEST</p>
        </div>
    </div>

    <div id="main-app">
        <nav>
            <img src="logo.gif" class="brand-logo">
            <div onclick="toggleDrawer()" style="cursor:pointer; padding: 5px;">
                <div style="width:22px; height:2px; background:white; margin:5px;"></div>
                <div style="width:22px; height:2px; background:white; margin:5px;"></div>
            </div>
        </nav>

        <div class="section-title">FRUIT LOVE ISLAND <span>S1 PREMIERE</span></div>
        <div class="carousel">
            <div class="show-card" onclick="openFeed(0)">
                <video muted loop autoplay playsinline><source src="episode1.mp4" type="video/mp4"></video>
                <div class="show-info">E1: THE FIRST SQUEEZE</div>
            </div>
        </div>

        <div class="section-title">PRETTY QUEENS <span>COMING SOON</span></div>
        <div class="carousel">
            <div class="show-card" style="opacity: 0.3;">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000">
                <div class="show-info">S1 TEASER</div>
            </div>
        </div>
        
        <div style="padding: 40px; text-align: center; font-size: 10px; color: #222; letter-spacing: 2px;">
            AI CINEMA NETWORK V2.3 ONLINE
        </div>
    </div>

    <div id="video-feed">
        <div class="close-feed" onclick="closeFeed()">✕</div>
        
        <div class="feed-item">
            <video class="feed-video" loop playsinline onclick="toggleVideo(this)">
                <source src="episode1.mp4" type="video/mp4">
            </video>
            
            <div class="feed-sidebar">
                <button class="action-btn" onclick="this.style.color='var(--zeus-red)'">❤️<span>1.2k</span></button>
                <button class="action-btn" onclick="alert('Join the chat soon!')">💬<span>452</span></button>
                <button class="action-btn" onclick="toggleMute(this)">🔊</button>
            </div>

            <div class="feed-ui">
                <h2 style="margin:0; font-size: 20px; color: var(--zeus-red);">FRUIT LOVE ISLAND</h2>
                <p style="margin:5px 0; font-size:14px; color:#fff;">E1: The First Squeeze 🍎</p>
            </div>

            <div class="video-controls">
                <input type="range" class="seeker" value="0" min="0" max="100" oninput="seekVideo(this)">
            </div>
        </div>
    </div>

    <script>
        // --- YOUR FIREBASE CONFIG ---
        const firebaseConfig = {
    apiKey: "AIzaSyA11ejzUSS4Vxuxq2BolT-1zYbbTC6lS58",
    authDomain: "ai-cinema-7589b.firebaseapp.com",
    projectId: "ai-cinema-7589b",
    storageBucket: "ai-cinema-7589b.firebasestorage.app",
    messagingSenderId: "644187979775",
    appId: "1:644187979775:web:93384ffa68a9b1815c31ca",
    measurementId: "G-VJXN2W3ETD"
  };
        firebase.initializeApp(firebaseConfig);

        /* --- AUTH SYSTEM --- */
        let isSignUp = false;
        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('auth-title').innerText = isSignUp ? "SIGN UP WITH" : "SIGN IN WITH";
            document.getElementById('auth-toggle').innerText = isSignUp ? "ALREADY A MEMBER? LOGIN" : "NEW TO THE NETWORK? SIGN UP";
        }

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('drawer-name').innerText = user.displayName ? user.displayName.toUpperCase() : "MEMBER";
                
                // ADMIN CHECK: Change to your email
                if (user.email === "your-email@gmail.com") {
                    document.getElementById('admin-link').style.display = 'block';
                }
            }
        });

        function signIn(type) {
            if (type === 'guest') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                return;
            }
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).catch(e => alert(e.message));
        }

        /* --- VIDEO FEED CONTROLS --- */
        function openFeed(index) {
            const feed = document.getElementById('video-feed');
            feed.style.display = 'block';
            const v = document.querySelectorAll('.feed-video')[index];
            v.play();
        }

        function closeFeed() {
            document.getElementById('video-feed').style.display = 'none';
            document.querySelectorAll('.feed-video').forEach(v => v.pause());
        }

        function toggleVideo(v) { v.paused ? v.play() : v.pause(); }
        
        function toggleMute(btn) {
            const v = btn.closest('.feed-item').querySelector('video');
            v.muted = !v.muted;
            btn.innerText = v.muted ? '🔇' : '🔊';
        }

        function seekVideo(range) {
            const v = range.closest('.feed-item').querySelector('video');
            v.currentTime = (range.value / 100) * v.duration;
        }

        document.querySelectorAll('.feed-video').forEach(v => {
            v.ontimeupdate = () => {
                const range = v.parentElement.querySelector('.seeker');
                if(range) range.value = (v.currentTime / v.duration) * 100;
            };
        });

        /* --- UI HELPERS --- */
        function toggleDrawer() {
            const d = document.getElementById('sideDrawer');
            d.classList.toggle('active');
            document.getElementById('overlay').style.display = d.classList.contains('active') ? 'block' : 'none';
        }

        function signOut() { firebase.auth().signOut().then(() => location.reload()); }
        function deleteAccount() { if(confirm("Permanently delete account?")) firebase.auth().currentUser.delete().then(()=>location.reload()); }
    </script>
</body>
</html>
