<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Cinema v2</title>

<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050505;
  color:white;
}

/* LOGIN */
#login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:#111;
  padding:40px;
  border-radius:12px;
  text-align:center;
  width:300px;
}
button{padding:10px 15px; cursor:pointer}

/* MAIN */
.hidden{display:none}

nav{
  display:flex;
  justify-content:space-between;
  padding:20px;
  border-bottom:1px solid #222;
}
.logo{color:#ff204e;font-weight:900}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:20px;
}

.item{
  background:#111;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
}
.item:hover{transform:scale(1.03)}
.item img{width:100%;height:120px;object-fit:cover}
.item div{padding:10px}

/* ADMIN */
#admin{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  padding:15px;
  border-radius:10px;
  border:1px solid #333;
  width:250px;
}
input{
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#000;
  border:1px solid #333;
  color:white;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h2 style="color:#ff204e">AI CINEMA</h2>
    <button onclick="login()">Sign in with Google</button>
    <p id="err"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
  <div class="logo">AI CINEMA 🍿</div>
  <button onclick="logout()">Logout</button>
</nav>

<div id="list" class="grid"></div>

<!-- ADMIN PANEL -->
<div id="admin" class="hidden">
  <h3>Admin</h3>
  <input id="t" placeholder="title">
  <input id="d" placeholder="desc">
  <input id="i" placeholder="image url">
  <input id="v" placeholder="video url">
  <button onclick="add()">Add</button>
</div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyA11ejzUSS4Vxuxq2BolT-1zYbbTC6lS58",
    authDomain: "ai-cinema-7589b.firebaseapp.com",
    projectId: "ai-cinema-7589b",
    storageBucket: "ai-cinema-7589b.firebasestorage.app",
    messagingSenderId: "644187979775",
    appId: "1:644187979775:web:93384ffa68a9b1815c31ca",
    measurementId: "G-VJXN2W3ETD"
  };

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

/* 🔥 PUT YOUR UID HERE */
const ADMIN_UIDS = ["GFTE6DKoQsdxX0mXoABSXNOyt072"];

let user = null;

/* UI */
function showLogin(){
  document.getElementById("login").classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");
}

function showApp(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
}

/* AUTH FIXED */
auth.onAuthStateChanged(async u=>{
  if(!u){
    user = null;
    showLogin();
    return;
  }

  user = u;
  showApp();
  load();

  if(ADMIN_UIDS.includes(u.uid)){
    document.getElementById("admin").classList.remove("hidden");
  } else {
    document.getElementById("admin").classList.add("hidden");
  }
});

/* LOGIN */
function login(){
  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider).catch(e=>{
    document.getElementById("err").innerText = e.message;
  });
}

/* LOGOUT */
function logout(){
  auth.signOut();
}

/* LOAD EPISODES */
async function load(){
  const snap = await db.collection("episodes").orderBy("created","desc").get();

  const list = document.getElementById("list");
  list.innerHTML = "";

  snap.forEach(doc=>{
    const d = doc.data();

    const el = document.createElement("div");
    el.className = "item";

    el.innerHTML = `
      <img src="${d.i}">
      <div>
        <b>${d.t}</b>
        <p style="color:#888;font-size:12px">${d.d}</p>
      </div>
    `;

    el.onclick = ()=>play(d.v);

    list.appendChild(el);
  });
}

/* ADD EPISODE */
async function add(){
  await db.collection("episodes").add({
    t: document.getElementById("t").value,
    d: document.getElementById("d").value,
    i: document.getElementById("i").value,
    v: document.getElementById("v").value,
    created: Date.now()
  });

  load();
}

/* PLAY */
function play(url){
  const w = window.open();
  w.document.write(`
    <style>body{margin:0;background:black}</style>
    <video autoplay controls style="width:100%;height:100vh">
      <source src="${url}">
    </video>
  `);
}
</script>

</body>
</html>
